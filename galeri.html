<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galeri - Kopi Paten Kulo</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- Skip link -->
  <a class="skip-link" href="#konten">Lewati ke konten utama</a>

  <!-- Header dan navigasi -->
  <header class="site-header">
    <nav class="nav" aria-label="Navigasi utama">
      <a class="brand" href="index.html">Kopi Paten Kulo</a>

      <ul>
        <li>
          <a href="index.html">Beranda</a>
        </li>

        <li>
          <a href="tentang.html">Tentang Kami</a>
        </li>

        <li>
          <a href="produk.html">Produk</a>
        </li>

        <li>
          <a aria-current="page" href="galeri.html">Galeri</a>
        </li>
      </ul>
    </nav>
  </header>

  <!-- Konten utama -->
  <main id="konten">

    <h1>Galeri</h1>

    <!-- Foto produk -->
    <section aria-labelledby="produk-galeri">
      <h2 id="produk-galeri">Foto Produk Kopi</h2>

      <div class="gallery-list">

        <!-- Kopi Susu Original -->
        <figure>
          <img
            src="assets/images/kopi-susu-original.jpeg"
            alt="Kopi Susu Original Kopi Paten Kulo"
          >
          <figcaption>Kopi Susu Original</figcaption>
        </figure>

        <!-- Kopi Susu Gula Aren -->
        <figure>
          <img
            src="assets/images/kopi-gula-aren.jpeg"
            alt="Kopi Susu Gula Aren Kopi Paten Kulo"
          >
          <figcaption>Kopi Susu Gula Aren</figcaption>
        </figure>

        <!-- Matcha Latte -->
        <figure>
          <img
            src="assets/images/matcha-latte.jpeg"
            alt="Matcha Latte Kopi Paten Kulo"
          >
          <figcaption>Matcha Latte</figcaption>
        </figure>

      </div>
    </section>

    <section aria-labelledby="proses-title">
  <h2 id="proses-title">Proses Penyeduhan</h2>

  <figure>
    <img
      src="assets/images/proses-seduh.jpg"
      alt="Proses penyeduhan kopi Kopi Paten Kulo"
    >
    <figcaption>Proses penyeduhan kopi</figcaption>
  </figure>
</section>

    <!-- Audio -->
    <section aria-labelledby="audio-title">
      <h2 id="audio-title">Nada Penanda Kedai</h2>

      <p id="audio-note">
        Audio penanda suasana kedai Kopi Paten Kulo.
      </p>

      <audio controls aria-describedby="audio-note">
        <source
          src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA="
          type="audio/wav"
        >

        Browser Anda tidak mendukung pemutar audio.
      </audio>
    </section>

  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <p>&copy; 2026 Kopi Paten Kulo</p>
  </footer>

</html>
